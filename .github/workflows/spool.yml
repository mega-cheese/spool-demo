name: Spool PR Comment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  spool:
    runs-on: ubuntu-latest

    steps:
      - name: Check out spool-demo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Spool
        uses: actions/checkout@v4
        with:
          repository: mega-cheese/spool
          path: .spool-runtime
          token: ${{ secrets.SPOOL_GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Spool dependencies
        working-directory: .spool-runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify GitHub CLI
        run: gh --version

      - name: Run Spool merge authorization
        working-directory: .spool-runtime
        env:
          GH_TOKEN: ${{ secrets.SPOOL_GITHUB_TOKEN }}
        run: |
          python scripts/spool_check_pr.py \
            "${{ github.event.pull_request.html_url }}" \
            --repo-memory "${{ github.workspace }}/.spool/approved_decisions.yml" \
            --out "outputs/spool/pr-${{ github.event.pull_request.number }}"

      - name: Post Spool comment
        working-directory: .spool-runtime
        env:
          GH_TOKEN: ${{ secrets.SPOOL_GITHUB_TOKEN }}
        run: |
          python scripts/spool_comment_pr.py \
            "${{ github.event.pull_request.html_url }}" \
            --report "outputs/spool/pr-${{ github.event.pull_request.number }}/trust_report.json" \
            --post
